<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="CamoBits — an experimental banner experience on Robinhood Chain." />
  <link rel="canonical" href="https://camobits.xyz/" />
  <title>CamoBits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-grad g1"></div>
    <div class="bg-grad g2"></div>
    <div class="bg-grad g3"></div>
    <canvas id="bg-canvas"></canvas>
  </div>

  <header class="nav">
    <a class="logo" href="#top">CAMO<span>BITS</span></a>
    <nav class="nav-links">
      <a href="#mint">Mint</a>
      <a href="#lab">Lab</a>
      <a id="openseaNav" href="#" target="_blank" rel="noopener">OpenSea</a>
      <button type="button" class="wallet-chip" id="btnWalletNav" aria-label="Wallet">
        <span class="dot" id="walletDot"></span>
        <span id="walletChipLabel">Connect</span>
      </button>
    </nav>
  </header>

  <main id="top" class="page">
    <section class="hero">
      <p class="hero-tag">An experimental banner experience on Robinhood Chain</p>
      <h1><span class="accent">Living Banners</span></h1>
      <div class="hero-banner-frame">
        <img id="heroBanner" alt="" width="1500" height="500" />
      </div>
      <div class="hero-cta">
        <a class="btn primary" href="#mint">Mint</a>
        <a class="btn ghost" href="#lab">Lab</a>
        <a class="btn ghost" id="openseaHero" href="#" target="_blank" rel="noopener">OpenSea</a>
      </div>
      <ul class="stat-strip">
        <li><strong id="statMintedHero">—</strong><span>minted</span></li>
        <li><strong id="statPriceHero">—</strong><span>price</span></li>
        <li><strong>1500×500</strong><span>header</span></li>
      </ul>
    </section>

    <section class="section" id="gallery">
      <div class="section-head">
        <h2>Gallery</h2>
        <button type="button" class="btn ghost btn-sm" id="btnShuffle">Shuffle</button>
      </div>
      <div class="banner-strip" id="bannerStrip"></div>
    </section>

    <section class="section" id="lab">
      <div class="section-head"><h2>Lab</h2></div>
      <div class="lab-box">
        <div class="lab-locked" id="labLocked">
          <p>Tap connect to load yours.</p>
          <button type="button" class="btn secondary" id="btnConnectLab">Connect wallet</button>
        </div>
        <div class="lab-open hidden" id="labOpen">
          <div class="lab-controls">
            <select id="ownedSelect" aria-label="Your CamoBits"></select>
            <button type="button" class="btn primary" id="btnBannerPng">PNG</button>
          </div>
          <p class="banner-label" id="bannerLabel"></p>
          <div class="banner-preview-frame empty" id="previewFrame">
            <img id="bannerPreview" alt="" width="1500" height="500" />
            <p class="empty-msg" id="emptyMsg">None yet</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section mint-sec" id="mint">
      <div class="section-head"><h2>Mint</h2></div>
      <div class="mint-card">
        <div class="wallet-row">
          <button type="button" class="wallet-status" id="btnConnect">
            <span class="dot" id="mintDot"></span>
            <span id="walletStatusText">Not connected · tap to connect</span>
          </button>
          <button type="button" class="btn-text hidden" id="btnDisconnect">Disconnect</button>
        </div>
        <p class="mint-line"><span id="statMinted">—</span> minted</p>
        <div class="mint-actions">
          <label class="qty-lab">Qty <input id="qty" type="number" min="1" max="99" value="1" inputmode="numeric" /></label>
          <button type="button" class="btn primary" id="btnMint" disabled>Mint</button>
        </div>
        <p class="mint-note" id="mintNote">1 free · then ~¢30 each</p>
        <p class="mint-msg" id="mintMsg"></p>
      </div>
    </section>

    <footer class="footer">
      <div class="foot-left">
        <span class="logo">CAMO<span>BITS</span></span>
        <p class="treasury-line" title="Treasury">
          treasury
          <a id="treasuryLink" href="https://robinhoodchain.blockscout.com/address/0x76B2c9Dfd8DCe539A6e009c0B5283c44e2D45421" target="_blank" rel="noopener">0x76B2…5421</a>
        </p>
      </div>
      <a id="openseaFoot" href="#" target="_blank" rel="noopener">OpenSea</a>
    </footer>
  </main>

  <script src="app.js?v=19"></script>
</body>
</html>
